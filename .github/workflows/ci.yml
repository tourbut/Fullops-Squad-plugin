name: FullOps checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install schema validation dependencies
        run: npm ci --ignore-scripts
      - name: Build native package
        run: python3 scripts/build.py
      - name: Run setup, handover, common-rules and schema checks
        run: npm test
      - name: Check generated catalog consistency
        run: git diff --exit-code -- .agents/plugins/marketplace.json .claude-plugin/marketplace.json

  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OCR_NO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install existing pinned OCR CLI
        run: npm install --global @alibaba-group/open-code-review@1.12.5
      - name: Run real delegate record regression checks
        run: npm run test:review
