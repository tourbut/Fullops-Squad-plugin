name: FullOps checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # git 2.47+ runs auto maintenance detached after commit; it races temp-repo cleanup in tests.
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install schema validation dependencies
        run: npm ci --ignore-scripts
      - name: Build native package
        run: python3 scripts/build.py
      - name: Run setup, handover, common-rules and schema checks
        run: npm test
      - name: Check committed build output and catalogs match the source
        run: |
          git diff --exit-code -- dist .agents/plugins/marketplace.json .claude-plugin/marketplace.json
          test -z "$(git status --porcelain --untracked-files=all -- dist)"

  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OCR_NO_UPDATE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned OCR CLI
        run: npm install --global @alibaba-group/open-code-review@1.12.12
      - name: Run real delegate record regression checks
        run: npm run test:review

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Check native launchers and failure recovery
        run: |
          node --test tests/npm-installer.cjs
          python tests/stabilization.py
          python tests/issue-mode.py
          python scripts/build.py
