name: FullOps checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR replaces its run; runs on main each finish, as they are the OS checks of record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one check a PR shows: build, every Linux test and the OCR review regression.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # git 2.47+ runs auto maintenance detached after commit; it races temp-repo cleanup in tests.
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: '0'
      OCR_NO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install schema validation dependencies
        run: npm ci --ignore-scripts
      - name: Build native package
        run: python3 scripts/build.py
      - name: Run setup, handover, common-rules and schema checks
        run: npm test
      - name: Check committed build output and catalogs match the source
        run: |
          git diff --exit-code -- dist .agents/plugins/marketplace.json .claude-plugin/marketplace.json
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - name: Install latest OCR CLI
        run: npm install --global @alibaba-group/open-code-review@latest
      - name: Run real delegate record regression checks
        run: npm run test:review

  # Windows and macOS run after a merge to main, or by hand from the Actions tab; a PR does not wait on them.
  portable:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: '0'
    steps:
      # .gitattributes was removed for the plugin directory. Keep Windows checkouts LF like the committed files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Check native launchers and failure recovery
        run: |
          node --test tests/npm-installer.cjs
          python tests/stabilization.py
          python tests/web-engine.py
          python tests/search-index.py
          python tests/issue-mode.py
          python scripts/build.py

  web-browser:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      # .gitattributes was removed for the plugin directory. Keep Windows checkouts LF like the committed files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Prepare optional browser runtime only for this isolated CI fixture
        run: |
          npm install --prefix .fullops-web-test --ignore-scripts --no-save --package-lock=false @playwright/cli@latest
          node .fullops-web-test/node_modules/playwright/cli.js install chromium
      - name: Replay healthy and inserted-bug fixtures without a model API
        run: python tests/web-browser.py --engine playwright --playwright-package .fullops-web-test/node_modules/@playwright/cli/package.json
