<!doctype html><html lang="en" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated acceptance fixture</title>
<style>:root{color-scheme:light;--bg:#fff;--fg:#202020;--border:#707070}html[data-theme=dark]{color-scheme:dark;--bg:#161616;--fg:#eee;--border:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}main{max-width:640px;padding:16px}form,label{display:flex;flex-wrap:wrap;gap:8px;align-items:center}input{min-width:0;max-width:100%;font:inherit;border:1px solid var(--border);height:36px}button,select{font:inherit;min-height:36px;margin:4px 4px 4px 0}li{padding:8px}button,input,select{background:var(--bg);color:var(--fg)}:focus-visible{outline:3px solid #1686df;outline-offset:3px}[hidden]{display:none!important}dialog{background:var(--bg);color:var(--fg);border:2px solid var(--border)}@media(prefers-reduced-motion:no-preference){body{transition:background .1s ease}}</style>
<main><h1>Todo acceptance fixture</h1><button id="theme" type="button" aria-pressed="false">Dark theme</button><form id="add"><label>New todo <input id="todo" autocomplete="off" required aria-keyshortcuts="Alt+n"></label><button>Add</button></form><p id="status" role="status">No todos yet</p><ul id="list"></ul><p>Submissions: <output id="submits">0</output></p>
<label>Load case <select id="loadcase"><option value="empty">Empty</option><option value="data">Data</option><option value="error">Error</option></select></label><button id="load">Load</button><button id="retry" hidden>Retry</button><button id="clear">Clear todos</button><button id="details">Details</button><button id="restricted" disabled>Restricted</button><section id="detail" hidden><h2>Details</h2><button id="back">Back</button></section><dialog id="confirm"><p>Clear all todos?</p><button id="cancel">Cancel</button><button id="confirmclear">Confirm clear</button></dialog></main>
<script>
window.submits=0;window.loadRequests=0;const list=document.querySelector('#list'),input=document.querySelector('#todo'),status=document.querySelector('#status');
document.addEventListener('keydown',e=>{if(e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.isComposing&&e.key.toLowerCase()==='n'){e.preventDefault();if(!document.querySelector('#confirm').open)input.focus();}});
function addTodo(text){const li=document.createElement('li'),label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.setAttribute('aria-label','Toggle '+text);label.append(box,document.createTextNode(text));li.append(label);list.append(li);status.textContent='Todo ready';}
document.querySelector('#add').onsubmit=e=>{e.preventDefault();window.submits++;document.querySelector('#submits').value=String(window.submits);addTodo(input.value);input.value='';input.focus();};
document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').setAttribute('aria-pressed',String(dark));};
async function load(){window.loadRequests++;const button=document.querySelector('#load');button.disabled=true;document.querySelector('#retry').hidden=true;status.textContent='Loading';await new Promise(r=>setTimeout(r,100));const mode=document.querySelector('#loadcase').value;if(mode==='error'){status.textContent='Could not load todos';document.querySelector('#retry').hidden=false;}else{list.replaceChildren();if(mode==='data')addTodo('loaded');else status.textContent='No todos yet';}button.disabled=false;}
document.querySelector('#load').onclick=load;document.querySelector('#retry').onclick=load;
const dialog=document.querySelector('#confirm');document.querySelector('#clear').onclick=()=>{dialog.showModal();document.querySelector('#cancel').focus();};function cancel(){dialog.close();document.querySelector('#clear').focus();}document.querySelector('#cancel').onclick=cancel;dialog.addEventListener('cancel',()=>setTimeout(()=>document.querySelector('#clear').focus(),0));document.querySelector('#confirmclear').onclick=()=>{list.replaceChildren();status.textContent='No todos yet';cancel();};document.querySelector('#details').onclick=()=>{document.querySelector('#detail').hidden=false;history.pushState({details:true},'',location.pathname+'#details');document.querySelector('#back').focus();};function back(){document.querySelector('#detail').hidden=true;document.querySelector('#details').focus();}document.querySelector('#back').onclick=()=>{history.back();back();};addEventListener('popstate',back);
</script></html>
