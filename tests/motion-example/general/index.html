<!doctype html>
<!-- Narrated HyperFrames introduction: no text before 13s, Korean closing at 13-15s. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="public/gsap.min.js"></script>
  <style>
    :root { --background: #142032; --accent: #8de0c4; --text: #ffffff; }
    @font-face { font-family: MotionKorean; src: url('public/NanumBarunGothic.ttf'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 720px; background: var(--background); }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #shape { width: 250px; height: 250px; border: 36px solid var(--accent); border-radius: 40px; }
    h1 { font-family: MotionKorean; font-size: 64px; color: var(--text); margin: 0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1280" data-height="720" data-duration="15" data-fps="30">
    <section id="motion" class="clip" data-start="0" data-duration="13" data-track-index="0"><div id="shape"></div></section>
    <section id="closing" class="clip" data-start="13" data-duration="2" data-track-index="0"><h1>함께 만드는 모션</h1></section>
    <audio id="narration" src="public/narration.wav" data-start="0.5" data-track-index="1" data-volume="1"></audio>
  </div>
  <script>
    const tl = gsap.timeline({paused: true});
    tl.fromTo('#shape', {scale: 0.5, opacity: 0}, {scale: 1, opacity: 1, duration: 1, ease: 'power3.out'}, 0);
    tl.to('#shape', {rotation: 360, duration: 12, ease: 'none'}, 1);
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
    tl.seek(0);
  </script>
</body>
</html>
